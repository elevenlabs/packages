asyncapi: "2.6.0"
info:
  title: ElevenLabs Scribe Contract
  version: "1.0.0"
  description: |
    Real-time speech-to-text transcription service.
    This WebSocket API enables streaming audio input and receiving transcription results.

    ## Event Flow
    - Audio chunks are sent as input_audio_chunk messages
    - Transcription results are streamed back in various formats (partial, committed, with timestamps)
    - Supports manual commit or VAD-based automatic commit strategies
  contact:
    name: ElevenLabs API Support
    url: https://elevenlabs.io/docs
    email: support@elevenlabs.io

servers:
  production:
    url: wss://api.elevenlabs.io
    protocol: ws
    description: Production WebSocket server (US/Global)
  eu-residency:
    url: wss://api.eu.residency.elevenlabs.io
    protocol: ws
    description: EU residency WebSocket server for GDPR compliance
  in-residency:
    url: wss://api.in.residency.elevenlabs.io
    protocol: ws
    description: India residency WebSocket server for data locality
  development:
    url: ws://localhost:8080
    protocol: ws
    description: Local development server

channels:
  ScribeMessages:
    description: Main WebSocket channel for real-time transcription
    publish:
      summary: Messages sent from server to client
      message:
        oneOf:
          # Server -> Client messages
          - $ref: "#/components/messages/SessionStarted"
          - $ref: "#/components/messages/PartialTranscript"
          - $ref: "#/components/messages/FinalTranscript"
          - $ref: "#/components/messages/FinalTranscriptWithTimestamps"
          - $ref: "#/components/messages/CommittedTranscript"
          - $ref: "#/components/messages/CommittedTranscriptWithTimestamps"
          - $ref: "#/components/messages/CommittedTranscriptEntities"
          - $ref: "#/components/messages/Error"
          - $ref: "#/components/messages/AuthError"
          - $ref: "#/components/messages/QuotaExceededError"
          - $ref: "#/components/messages/CommitThrottledError"
          - $ref: "#/components/messages/TranscriberError"
          - $ref: "#/components/messages/UnacceptedTermsError"
          - $ref: "#/components/messages/RateLimitedError"
          - $ref: "#/components/messages/InputError"
          - $ref: "#/components/messages/InvalidRequestError"
          - $ref: "#/components/messages/QueueOverflowError"
          - $ref: "#/components/messages/ResourceExhaustedError"
          - $ref: "#/components/messages/SessionTimeLimitExceededError"
          - $ref: "#/components/messages/ChunkSizeExceededError"
          - $ref: "#/components/messages/InsufficientAudioActivityError"
    subscribe:
      summary: Messages received from client to server
      message:
        oneOf:
          # Client -> Server messages
          - $ref: "#/components/messages/InputAudioChunk"

components:
  messages:
    # ===== CLIENT → SERVER MESSAGES =====

    InputAudioChunk:
      name: InputAudioChunk
      title: Input Audio Chunk
      summary: Audio data from client
      contentType: application/json
      payload:
        $ref: "#/components/schemas/InputAudioChunkPayload"

    # ===== SERVER → CLIENT MESSAGES =====

    SessionStarted:
      name: SessionStartedMessage
      title: Session Started
      summary: Sent when the transcription session is successfully started
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SessionStartedPayload"

    PartialTranscript:
      name: PartialTranscriptMessage
      title: Partial Transcript
      summary: Interim transcription result (may change)
      contentType: application/json
      payload:
        $ref: "#/components/schemas/PartialTranscriptPayload"

    FinalTranscript:
      name: FinalTranscriptMessage
      title: Final Transcript
      summary: A final transcript for a segment, sent once speech has settled but before the segment is committed
      contentType: application/json
      payload:
        $ref: "#/components/schemas/FinalTranscriptPayload"

    FinalTranscriptWithTimestamps:
      name: FinalTranscriptWithTimestampsMessage
      title: Final Transcript with Timestamps
      summary: A delayed final transcript with word-level timestamps and/or the detected language. Only sent when includeTimestamps or includeLanguageDetection is enabled.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/FinalTranscriptWithTimestampsPayload"

    CommittedTranscript:
      name: CommittedTranscriptMessage
      title: Committed Transcript
      summary: Committed transcription result
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CommittedTranscriptPayload"

    CommittedTranscriptWithTimestamps:
      name: CommittedTranscriptWithTimestampsMessage
      title: Committed Transcript with Timestamps
      summary: Committed transcription result with word-level timestamps
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CommittedTranscriptWithTimestampsPayload"

    CommittedTranscriptEntities:
      name: CommittedTranscriptEntitiesMessage
      title: Committed Transcript Entities
      summary: Entities detected in a committed transcript. Only sent when the entityDetection option is set.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CommittedTranscriptEntitiesPayload"

    Error:
      name: ScribeErrorMessage
      title: Scribe Error Message
      summary: Error event during transcription
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeErrorPayload"

    AuthError:
      name: ScribeAuthErrorMessage
      title: Scribe Authentication Error
      summary: Authentication failed
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeAuthErrorPayload"

    QuotaExceededError:
      name: ScribeQuotaExceededErrorMessage
      title: Scribe Quota Exceeded Error
      summary: Quota exceeded
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeQuotaExceededErrorPayload"

    CommitThrottledError:
      name: ScribeCommitThrottledErrorMessage
      title: Scribe Commit Throttled Error
      summary: Commit throttled
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeCommitThrottledErrorPayload"

    TranscriberError:
      name: ScribeTranscriberErrorMessage
      title: Scribe Transcriber Error
      summary: Transcriber error
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeTranscriberErrorPayload"

    UnacceptedTermsError:
      name: ScribeUnacceptedTermsErrorMessage
      title: Scribe Unaccepted Terms Error
      summary: Unaccepted terms
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeUnacceptedTermsErrorPayload"

    RateLimitedError:
      name: ScribeRateLimitedErrorMessage
      title: Scribe Rate Limited Error
      summary: Rate limited
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeRateLimitedErrorPayload"

    InputError:
      name: ScribeInputErrorMessage
      title: Scribe Input Error
      summary: Input error
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeInputErrorPayload"

    InvalidRequestError:
      name: ScribeInvalidRequestErrorMessage
      title: Scribe Invalid Request Error
      summary: The connection parameters were rejected. The server accepts the socket, sends this error, then closes the session.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeInvalidRequestErrorPayload"

    QueueOverflowError:
      name: ScribeQueueOverflowErrorMessage
      title: Scribe Queue Overflow Error
      summary: Queue overflow
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeQueueOverflowErrorPayload"

    ResourceExhaustedError:
      name: ScribeResourceExhaustedErrorMessage
      title: Scribe Resource Exhausted Error
      summary: Resource exhausted
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeResourceExhaustedErrorPayload"

    SessionTimeLimitExceededError:
      name: ScribeSessionTimeLimitExceededErrorMessage
      title: Scribe Session Time Limit Exceeded Error
      summary: Session time limit exceeded
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeSessionTimeLimitExceededErrorPayload"

    ChunkSizeExceededError:
      name: ScribeChunkSizeExceededErrorMessage
      title: Scribe Chunk Size Exceeded Error
      summary: Chunk size exceeded
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeChunkSizeExceededErrorPayload"

    InsufficientAudioActivityError:
      name: ScribeInsufficientAudioActivityErrorMessage
      title: Scribe Insufficient Audio Activity Error
      summary: Insufficient audio activity
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ScribeInsufficientAudioActivityErrorPayload"

  schemas:
    MessageType:
      type: string
      enum:
        - session_started
        - partial_transcript
        - final_transcript
        - final_transcript_with_timestamps
        - committed_transcript
        - committed_transcript_with_timestamps
        - committed_transcript_entities
        - error
        - auth_error
        - invalid_request
        - input_audio_chunk
      description: Types of messages that can be exchanged

    AudioFormat:
      type: string
      enum:
        - pcm_8000
        - pcm_16000
        - pcm_22050
        - pcm_24000
        - pcm_44100
        - pcm_48000
        - ulaw_8000
      description: Audio encoding format

    CommitStrategy:
      type: string
      enum:
        - manual
        - vad
      description: Strategy for committing transcriptions

    # This shape is shared verbatim by CommittedTranscriptWithTimestamps and
    # FinalTranscriptWithTimestamps: the live contract (fetched from
    # https://api.elevenlabs.io/speech-to-text-asyncapi.yml) uses the exact
    # same word schema for both, including "audio_event", structured
    # characters, and channel_index.
    Word:
      type: object
      title: Word
      description: |
        Word-level detail of the transcription with timing information.
        "audio_event" is used for non-word sounds like laughter or footsteps.
      required: [text, type, logprob]
      properties:
        text:
          type: string
          description: The word or sound that was transcribed
        start:
          type: number
          description: The start time of the word or sound in seconds
        end:
          type: number
          description: The end time of the word or sound in seconds
        type:
          type: string
          title: WordType
          description: The type of the word or sound
          enum:
            - word
            - spacing
            - audio_event
        speaker_id:
          type: string
          description: Unique identifier for the speaker of this word
        logprob:
          type: number
          description: |
            The log of the probability with which this word was predicted.
            Logprobs are in range [-infinity, 0], higher logprobs indicate a
            higher confidence the model has in its predictions.
        characters:
          type: array
          description: The characters that make up the word and their timing information
          items:
            $ref: "#/components/schemas/TranscriptCharacter"
        channel_index:
          type: integer
          description: The channel this word was spoken on (for multichannel audio). Null for single-channel transcriptions.

    TranscriptCharacter:
      type: object
      title: TranscriptCharacter
      description: A character within a word, with its own timing
      required: [text]
      properties:
        text:
          type: string
          description: The character that was transcribed
        start:
          type: number
          description: Start time in seconds
        end:
          type: number
          description: End time in seconds

    DetectedEntity:
      type: object
      title: DetectedEntity
      description: An entity detected within a committed transcript
      required: [text, entity_type, start_char, end_char]
      properties:
        text:
          type: string
          description: The text that was identified as an entity
        entity_type:
          type: string
          description: The type of entity detected (e.g. 'credit_card', 'email_address', 'person_name')
        start_char:
          type: integer
          description: Start character position in the transcript text
        end_char:
          type: integer
          description: End character position in the transcript text

    # ===== CLIENT MESSAGE PAYLOADS =====

    InputAudioChunkPayload:
      type: object
      required: [message_type, audio_base_64, commit, sample_rate]
      properties:
        message_type:
          type: string
          const: input_audio_chunk
        audio_base_64:
          type: string
          description: Base64-encoded audio data
          format: base64
        commit:
          type: boolean
          description: Whether to commit the transcription after this chunk
        sample_rate:
          type: integer
          description: Sample rate of the audio in Hz
        previous_text:
          type: string
          description: Send context to the model via base64 encoded audio or text from a previous transcription. Can only be sent alongside the first audio chunk. If sent in a subsequent chunk, an error will be returned.

    # ===== SERVER MESSAGE PAYLOADS =====

    SessionStartedPayload:
      type: object
      required: [message_type, session_id, config]
      properties:
        message_type:
          type: string
          const: session_started
        session_id:
          type: string
          description: Session ID
        config:
          type: object
          description: Configuration for the transcription session
          properties:
            sample_rate:
              type: integer
              description: Sample rate of the audio in Hz
            audio_format:
              $ref: "#/components/schemas/AudioFormat"
            language_code:
              type: string
              description: Language code in ISO 639-1 or ISO 639-3 format
            secondary_languages:
              type: array
              items:
                type: string
              description: Additional language codes that may be present in the audio
            timestamps_granularity:
              type: string
              enum:
                - none
                - word
                - character
              description: Granularity of timestamps included in delayed final/committed transcripts.
            vad_commit_strategy:
              type: string
              enum:
                - manual
                - vad
              description: Strategy for committing transcriptions
            vad_silence_threshold_secs:
              type: number
              description: Silence threshold in seconds
            vad_threshold:
              type: number
              description: Threshold for voice activity detection
            min_speech_duration_ms:
              type: integer
              description: Minimum speech duration in milliseconds
            min_silence_duration_ms:
              type: integer
              description: Minimum silence duration in milliseconds
            max_tokens_to_recompute:
              type: integer
              description: Maximum number of tokens to recompute when finalizing a delayed transcript.
            model_id:
              type: string
              description: ID of the model to use for transcription
            enable_logging:
              type: boolean
              description: Whether the session may be logged. When false, zero retention mode is used and history features are unavailable for the session.
            include_language_detection:
              type: boolean
              description: Whether the session includes language detection in the delayed final transcript.
            keyterms:
              type: array
              items:
                type: string
              description: List of keyterms the model is biased towards.
            no_verbatim:
              type: boolean
              description: Whether filler words and disfluencies are removed from the transcript.
            entity_detection:
              type: array
              items:
                type: string
              description: Entity categories or types the session detects on committed transcripts.
            filter_background_audio:
              type: boolean
              description: Whether background speech filtering is enabled to reduce false activations from nearby conversations and ambient noise.

    PartialTranscriptPayload:
      type: object
      required: [message_type, text]
      properties:
        message_type:
          type: string
          const: partial_transcript
        text:
          type: string
          description: Partial transcription text

    FinalTranscriptPayload:
      type: object
      required: [message_type, text]
      properties:
        message_type:
          type: string
          const: final_transcript
        text:
          type: string
          description: Final transcription text for the segment. Unlike a partial transcript this will not change, but the segment is not yet committed.

    FinalTranscriptWithTimestampsPayload:
      type: object
      required: [message_type, text]
      properties:
        message_type:
          type: string
          const: final_transcript_with_timestamps
        text:
          type: string
          description: Final transcription text
        language_code:
          type: string
          nullable: true
          description: Detected or specified language code
        words:
          type: array
          nullable: true
          description: Word-level information with timestamps
          items:
            $ref: "#/components/schemas/Word"

    CommittedTranscriptPayload:
      type: object
      required: [message_type, text]
      properties:
        message_type:
          type: string
          const: committed_transcript
        text:
          type: string
          description: Committed transcription text

    CommittedTranscriptWithTimestampsPayload:
      type: object
      required: [message_type, text]
      properties:
        message_type:
          type: string
          const: committed_transcript_with_timestamps
        text:
          type: string
          description: Committed transcription text
        language_code:
          type: string
          nullable: true
          description: Detected or specified language code
        words:
          type: array
          nullable: true
          description: Word-level information with timestamps
          items:
            $ref: "#/components/schemas/Word"

    CommittedTranscriptEntitiesPayload:
      type: object
      required: [message_type, text, entities]
      properties:
        message_type:
          type: string
          const: committed_transcript_entities
        text:
          type: string
          description: The committed transcript text the entities were detected in
        entities:
          type: array
          description: Detected entities. Empty when none were found.
          items:
            $ref: "#/components/schemas/DetectedEntity"

    # Base error structure - used as anchor for all error payloads
    ScribeErrorBase: &ScribeErrorBase
      type: object
      required: [message_type, error]
      properties:
        error:
          type: string
          description: Error message with details

    # Generic error that can represent any error type
    ScribeErrorPayload:
      type: object
      required: [message_type, error]
      properties:
        message_type:
          type: string
          enum:
            - error
            - auth_error
            - quota_exceeded
            - commit_throttled
            - transcriber_error
            - unaccepted_terms
            - rate_limited
            - input_error
            - invalid_request
            - queue_overflow
            - resource_exhausted
            - session_time_limit_exceeded
            - chunk_size_exceeded
            - insufficient_audio_activity
          description: Type of error that occurred
        error:
          type: string
          description: Error message with details

    ScribeAuthErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: auth_error
        error:
          type: string

    ScribeQuotaExceededErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: quota_exceeded
        error:
          type: string

    ScribeCommitThrottledErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: commit_throttled
        error:
          type: string

    ScribeTranscriberErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: transcriber_error
        error:
          type: string

    ScribeUnacceptedTermsErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: unaccepted_terms
        error:
          type: string

    ScribeRateLimitedErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: rate_limited
        error:
          type: string

    ScribeInputErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: input_error
        error:
          type: string

    ScribeInvalidRequestErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: invalid_request
        error:
          type: string

    ScribeQueueOverflowErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: queue_overflow
        error:
          type: string

    ScribeResourceExhaustedErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: resource_exhausted
        error:
          type: string

    ScribeSessionTimeLimitExceededErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: session_time_limit_exceeded
        error:
          type: string

    ScribeChunkSizeExceededErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: chunk_size_exceeded
        error:
          type: string

    ScribeInsufficientAudioActivityErrorPayload:
      <<: *ScribeErrorBase
      properties:
        message_type:
          type: string
          const: insufficient_audio_activity
        error:
          type: string